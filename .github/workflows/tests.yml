name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install numpy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Fetch pinned official ComfyUI sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request
          sha = '1332fabfcc507aa7c548cd5152071ed494c207e8'
          for name in ('comfy/hooks.py', 'comfy/samplers.py', 'node_helpers.py'):
              path = Path('.reference') / name
              path.parent.mkdir(parents=True, exist_ok=True)
              with urllib.request.urlopen(f'https://raw.githubusercontent.com/Comfy-Org/ComfyUI/{sha}/{name}', timeout=30) as response:
                  path.write_bytes(response.read())
          PY
      - name: Native ComfyUI hooks and sampler integration
        run: python tests/check_native_sampler.py .reference/comfy/hooks.py .reference/comfy/samplers.py .reference/node_helpers.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend tests
        run: node --test tests/frontend.test.mjs
